[project]
name = "palisades-pipeline"
version = "0.1.0"
description = "OpenPali recovery-intelligence pipeline and platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h3>=4.5.0",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "orjson>=3.11.9",
    # pandas 2.x: nothing in the repo imports pandas directly; lifelines
    # (censoring-aware analytics) currently requires pandas<3.0.
    "pandas>=2.1,<3.0",
    "pyarrow>=24.0.0",
    "pyproj>=3.7.2",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "tenacity>=9.1.4",
    # --- platform spine (versions verified against PyPI 2026-07-11) ---
    "sqlalchemy>=2.0.51",
    "geoalchemy2>=0.20.0",
    "alembic>=1.18.5",
    "psycopg[binary]>=3.3.4",
    "fastapi>=0.139.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.13.4",
    "boto3>=1.43.0",
    "prefect>=3.7.8",
    "mlflow>=3.14.0",
    # --- analytics / ML ---
    "lifelines>=0.30.3",
    # --- spatial sources ---
    "rasterio>=1.5.0",
    "laspy[lazrs]>=2.7.0",
]

[project.scripts]
openpali = "openpali.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openpali", "palisades", "core"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
