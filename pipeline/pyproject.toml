[project]
name = "palisades-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h3>=4.5.0",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "orjson>=3.11.9",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pyproj>=3.7.2",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
orchestration = [
    "dagster>=1.13.11",
    "dagster-webserver>=1.13.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
