# CI mirrors the local gates exactly: the same scripts a developer or the
# evaluator runs. The fast gate needs no services; the full gate's service
# half is Compose-based and runs on the deployment host (documented in
# scripts/check-full), so CI covers the host half plus image builds, SBOM,
# and dependency/secret scans.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements-lock.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pipeline dependencies (locked)
        run: |
          python -m venv pipeline/.venv
          pipeline/.venv/bin/pip install --no-cache-dir -r pipeline/requirements-lock.txt
          pipeline/.venv/bin/pip install --no-deps -e pipeline

      - name: Install web dependencies (locked)
        run: cd web && npm ci

      - name: Fast gate (same script as local)
        run: sh scripts/check-fast

      - name: Web production build
        run: cd web && npm run build

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images (digest-pinned bases)
        run: |
          docker build -t openpali-pipeline:ci pipeline
          docker build -t openpali-web:ci web
          docker build -t openpali-e2e:ci -f web/e2e.Dockerfile web

      - name: SBOM (SPDX) for the pipeline image
        uses: anchore/sbom-action@v0
        with:
          image: openpali-pipeline:ci
          format: spdx-json
          artifact-name: sbom-pipeline.spdx.json

      - name: SBOM (SPDX) for the web image
        uses: anchore/sbom-action@v0
        with:
          image: openpali-web:ci
          format: spdx-json
          artifact-name: sbom-web.spdx.json

      - name: Vulnerability scan (fails on fixable critical/high)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: openpali-pipeline:ci
          severity-cutoff: high
          only-fixed: true

      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Python dependency audit (report-only; image scan above fails the job)
        run: |
          python -m pip install pip-audit
          pip-audit -r pipeline/requirements-lock.txt --strict || true

      - name: npm audit (production deps)
        run: cd web && npm audit --omit=dev --audit-level=high
