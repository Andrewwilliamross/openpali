name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pipeline-tests:
    name: pipeline tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q

  dagster-defs:
    name: validate orchestration definitions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate Dagster code location
        run: uv run --group orchestration dagster definitions validate -f orchestration/definitions.py
