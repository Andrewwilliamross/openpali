<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" role="img" aria-labelledby="pelican-title pelican-description">
  <title id="pelican-title">OpenPali’s field-note pelican</title>
  <desc id="pelican-description">A curious white pelican faces right, holding a small cobalt field notebook against its chest. Its long blue bill curves into a soft pouch. Two separate webbed feet are ready for a walk.</desc>
  <style>
    .ink{stroke:#183554;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .fine{fill:none;stroke:#183554;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .paper{fill:#fffef9}.blue{fill:#1557ff}.ink-fill{fill:#183554}
    #left-foot{transform-origin:109px 205px}#right-foot{transform-origin:144px 205px}
    #body{transform-origin:135px 155px}#head{transform-origin:139px 138px}
    #wing{transform-origin:105px 154px}#eye{transform-origin:153px 64px}
    #notebook{transform-origin:155px 171px}#pencil{transform-origin:195px 186px}
  </style>

  <g id="left-foot" class="left-foot" data-pivot="109 205">
