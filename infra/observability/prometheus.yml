# Observability profile: blackbox-probed service health with one alert rule.
# Fast intervals — this is a local deployment's liveness watch, not a fleet.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: service-probes
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api:8000/health/ready
          - http://web:80/
          - http://mlflow:5000/health
          - http://prefect-server:4200/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: probed
      - target_label: __address__
        replacement: blackbox:9115
