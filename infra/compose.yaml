    depends_on:
      prefect-server:
        condition: service_healthy
    networks: [internal]
    profiles: [jobs]

  # OPS restore drill: dump the live civic database and DESTRUCTIVELY restore
  # it into a clean namespace (a fresh database in the same instance), verify
  # row counts + the current-release pointer match, then drop the namespace.
  # Uses the same pinned postgis image as the primary (client tools included).
  restore-drill:
    image: ghcr.io/baosystems/postgis:17-3.5@sha256:d63ea2f9c038b80bb30cc4f4fb41e11cf6fc9dedfd16b1c6a0095dddc1c22785
    entrypoint: ["sh", "-ceu"]
    command:
      - |
        export PGPASSWORD=openpali-local-fixture-db
        H="-h postgres -U openpali"
        QFILE=/tmp/queries.txt
        cat > "$$QFILE" <<'QEOF'
        SELECT count(*) FROM civic.recovery_observation
        SELECT count(*) FROM civic.snapshot
        SELECT count(*) FROM ops.publication WHERE status='published'
        SELECT current_release_id FROM ops.current_release WHERE id=1
        SELECT manifest_sha256 FROM ops.publication WHERE release_id=(SELECT current_release_id FROM ops.current_release WHERE id=1)
        SELECT count(*) FROM spatial.spatial_asset
        SELECT count(*) FROM ml.model_version
        SELECT count(*) FROM ml.promotion_decision
        QEOF
        echo "== reference values captured AT dump time (live keeps moving) =="
        : > /tmp/reference.txt
        while IFS= read -r q; do
          psql $$H -tA openpali -c "$$q" >> /tmp/reference.txt
        done < "$$QFILE"
        echo "== dump ALL live databases (civic + prefect + mlflow) =="
        for db in openpali prefect mlflow; do
          pg_dump $$H -Fc "$$db" > "/tmp/$$db.dump"
          ls -la "/tmp/$$db.dump"
        done
        pa=$$(psql $$H -tA prefect -c "SELECT count(*) FROM flow_run")
        ma=$$(psql $$H -tA mlflow -c "SELECT count(*) FROM runs")
        echo "== destructive restore into clean namespaces =="
        for db in openpali prefect mlflow; do
          dropdb $$H --if-exists "$${db}_restore"
          createdb $$H "$${db}_restore"
          pg_restore $$H -d "$${db}_restore" --no-owner "/tmp/$$db.dump"
        done
        echo "== verify restored civic state matches the dump-time reference =="
        i=1
        while IFS= read -r q; do
          ref=$$(sed -n "$${i}p" /tmp/reference.txt)
          got=$$(psql $$H -tA openpali_restore -c "$$q")
          if [ "$$ref" != "$$got" ]; then
            echo "MISMATCH: [$$q] reference=$$ref restored=$$got"; exit 5
          fi
          echo "  match: [$$q] = $$got"
          i=$$((i + 1))
        done < "$$QFILE"
        echo "== verify restored orchestration/tracking metadata =="
        pb=$$(psql $$H -tA prefect_restore -c "SELECT count(*) FROM flow_run")
        [ "$$pa" = "$$pb" ] || { echo "MISMATCH prefect flow_run $$pa != $$pb"; exit 5; }
        echo "  match: prefect flow_run = $$pa"
        mb=$$(psql $$H -tA mlflow_restore -c "SELECT count(*) FROM runs")
        [ "$$ma" = "$$mb" ] || { echo "MISMATCH mlflow runs $$ma != $$mb"; exit 5; }
        echo "  match: mlflow runs = $$ma"
        echo "== drop restore namespaces =="
        for db in openpali prefect mlflow; do dropdb $$H "$${db}_restore"; done
        echo "RESTORE DRILL OK (db half; object/API half = restore-verify job)"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    profiles: [jobs]

  release-republish:
    # Re-promote the CURRENT release's snapshot through the registered
    # release-candidate deployment (worker-executed): the rebuilt manifest
    # picks up newly selected spatial assets and re-derives undocumented
    # values from run health.
    image: openpali-pipeline:local
    build:
      context: ../pipeline
    command:
      - sh
      - -ceu
      - |
        SNAPSHOT_ID=$$(python -c "
        import sys
        from openpali.storage.db import session_scope
        from openpali.storage.models import CurrentRelease, Publication
        from sqlalchemy import select
        with session_scope() as s:
            c = s.get(CurrentRelease, 1)
            p = s.execute(select(Publication).where(Publication.release_id == c.current_release_id)).scalar_one()
            if p.kind != 'representative':
                sys.exit(f'refusing: current release kind={p.kind}, not representative — heal the pointer first')
            print(p.snapshot_id)
        ")
        echo "republishing snapshot $$SNAPSHOT_ID as representative"
        openpali orchestrate-run release-candidate/default \
          --params "{\"snapshot_id\": \"$$SNAPSHOT_ID\", \"kind\": \"representative\"}"
    environment:
      OPENPALI_DATABASE_URL: postgresql+psycopg://openpali:openpali-local-fixture-db@postgres:5432/openpali
      OPENPALI_S3_ENDPOINT: http://object-store:8333
      OPENPALI_S3_ACCESS_KEY: openpali-local-fixture-access
      OPENPALI_S3_SECRET_KEY: openpali-local-fixture-secret
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    networks: [internal]
    profiles: [jobs]

  recon-drill:
    image: openpali-pipeline:local
