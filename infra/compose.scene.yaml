# Optional 3D building scene for the web container.
# Build it on the host first (`make scene-build`), then publish the scene the
# pointer names:  SCENE_ID=$(python3 -c "import json;print(json.load(open('data/out/scene/current.json'))['scene_id'])")
services:
  web:
    volumes:
      - ../data/out/scene/${SCENE_ID:?set SCENE_ID to the scene to publish}:/scene:ro
