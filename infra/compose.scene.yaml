# 3D building scene for the web container: the scene `make scene-build` last
# published (data/out/scene/current), served read-only at /scene/.
# Build it on the host first. Without this overlay the map still shows
# terrain, imagery and scored lots, and /scene/ answers 404.
services:
  web:
    volumes:
      - ../data/out/scene/current:/scene:ro
