server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml application/octet-stream;

    location /v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The building scene (`make scene-build`), one scene directory mounted
    # read-only at /scene (infra/compose.scene.yaml). Its file names are
    # stable across builds, so responses revalidate. A missing file is a 404,
    # never the app shell: binary loaders must not receive index.html.
    location /scene/ {
        root /;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # content-hashed build output
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / { try_files $uri $uri/ /index.html; }
}
